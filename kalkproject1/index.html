<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>KALKULATOR!!!!!!</h1>
    <input type="number" name="one" id="value1" />
    <input type="text" name="two" id="operator" />
    <input type="number" name="three" id="value2" />
    <input type="button" value="kalk" id="button" />
    <input type="button" value="clear" id="clear" />
    <p id="export"></p>
  </body>
  <script>
    const value1 = document.getElementById("value1");
    const asdd = document.getElementById("operator");
    const value2 = document.getElementById("value2");
    const print = document.getElementById("export");
    const button = document.getElementById("button");
    const clearbtn = document.getElementById("clear");

    function parbauditajs() {
      const num1 = +value1.value;
      const num2 = +value2.value;
      let returnText = calculateResult();

      print.innerHTML = returnText;
    }

    function calculateResult() {
      const num1 = +value1.value;
      const num2 = +value2.value;
      let returnText;

      if (asdd.value == "+") {
        return num1 + num2;
      } else if (asdd.value == "-") {
        return num1 - num2;
      } else if (asdd.value == "*") {
        return num1 * num2;
      } else if (asdd.value == "/") {
        return num1 / num2;
      }
    }

    button.addEventListener("click", parbauditajs);

    function clearing() {
      value1.value = "";
      asdd.value = "";
      value2.value = "";
      print.innerHTML = "";
    }
    clearbtn.addEventListener("click", clearing);
  </script>
</html>
